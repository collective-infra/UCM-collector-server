## Bird2 config file
## Located in /etc/bird/bird.conf

router id 10.70.90.47;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth0";
    interface "dummy0";
}

protocol kernel {
    scan time 10;
    persist;
    learn;
    metric 64;
    ipv4 {
        import none;
        export filter {
            if source = RTS_STATIC then reject;
            if net ~ [10.69.0.0/16] then reject;
            accept;
        };
    };
}

protocol ospf v2 {
    ipv4 {
        import all;
        export filter {
            ospf_metric1 = 1;
            accept;
        };
    };
    area 0 {
        networks {
            10.70.90.0/24;
            199.170.132.124/32;
        };
        interface "eth0" {
            cost 10;
            type broadcast;
        };
    };
}